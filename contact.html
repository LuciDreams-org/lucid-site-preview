     dropped it to ~175ms TBT / ~95 score, consistently, across 5 runs each.
     Meta Pixel previously fired immediately, un-deferred at all - the single
     biggest remaining unforced blocker. Tradeoff, on top of the GTM-only one
     already accepted: GA4/Ads/Meta/Reddit pixel fires move to window.load+3s,
     so a visitor who bounces before then isn't tracked on ANY platform, not

<!-- Crisp lead tracking: fire a dedup'd "lead" event on chat open/message -->
<script>
(function() {
  'use strict';
  var STORAGE_KEY = 'crispLeadFired';
  function trackEvent(name, data) {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push(Object.assign({event: name}, data));
    if (window.posthog && window.posthog.capture) window.posthog.capture(name, data);
  }
  function trackLeadOnce() {
    if (sessionStorage.getItem(STORAGE_KEY)) return;
    sessionStorage.setItem(STORAGE_KEY, '1');
    trackEvent('crisp_lead', { source: 'crisp_chat' });
  }
  function waitForCrisp() {
    if (window.$crisp && window.$crisp.push) {
      window.$crisp.push(['on', 'session:loaded', function() {
        window.$crisp.push(['on', 'chat:opened', trackLeadOnce]);
        window.$crisp.push(['on', 'message:send', trackLeadOnce]);
      }]);
    } else {
      setTimeout(waitForCrisp, 100);
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitForCrisp);
  } else {
    waitForCrisp();
  }
})();
</script>
