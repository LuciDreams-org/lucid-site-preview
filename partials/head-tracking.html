<!-- Nov 11 2026: GA4 + Google Ads fire early. gtag stubs queue immediately; gtag.js loads on browser
     idle (max 1s) so early bounces are tracked (~0.5s vs ~4s) at a small TBT cost. A/B (PSI, 8 mobile /
     5 desktop runs): mobile 99 -> 89, desktop 98 -> 98. GTM container itself stays deferred (load+3s). -->
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-C7R39B4QSW');
gtag('config', 'AW-17424075651');
(function(){
  function go(){var s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id=G-C7R39B4QSW';document.head.appendChild(s);}
  if('requestIdleCallback' in window) requestIdleCallback(go,{timeout:1000}); else setTimeout(go,300);
})();
</script>
<!-- Google Tag Manager, PostHog, Meta Pixel: all deferred window 'load' + 3s,
     same pattern already used for Crisp/Reddit/Hotjar in body-tracking.html.
     Isolation-tested Oct 29 2026: deferring GTM alone to 'load' barely moved
     the mobile score (TBT ~1900ms->~1740ms); blocking ALL 5 trackers together
     dropped it to ~175ms TBT / ~95 score, consistently, across 5 runs each.
     Meta Pixel previously fired immediately, un-deferred at all - the single
     biggest remaining unforced blocker. Tradeoff, on top of the GTM-only one
     already accepted: GA4/Ads/Meta/Reddit pixel fires move to window.load+3s,
     so a visitor who bounces before then isn't tracked on ANY platform, not
     just GTM's. dataLayer is initialized and gtm.start pushed immediately so
     early dataLayer.push() calls from elsewhere on the page still queue. -->
<script>
window.dataLayer = window.dataLayer || [];
window.dataLayer.push({'gtm.start': new Date().getTime(), event: 'gtm.js'});
window.addEventListener('load', function () {
  setTimeout(function () {
    (function(w,d,s,l,i){
      var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;
      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5WW4FVXM');
  }, 3000);
});
</script>
<!-- End Google Tag Manager -->
